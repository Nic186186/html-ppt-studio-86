<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HTML Anything｜Vibe Coding</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Noto+Sans+SC:wght@400;600;800&display=swap" rel="stylesheet"><style>
:root{--bg:#091018;--accent:#00d2ff;--soft:#103f50;--ink:#f2fbff;--mono:"IBM Plex Mono",monospace;--sans:"Noto Sans SC",sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05080d}.viewport{position:fixed;inset:0}.stage{position:absolute;width:1920px;height:1080px;transform-origin:0 0}.slide{position:absolute;inset:0;display:none;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans);padding:46px 58px;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:52px 52px}.slide.active{display:block}.chrome{height:52px;border:1px solid color-mix(in srgb,var(--accent) 44%,transparent);background:#0006;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font:600 13px var(--mono);color:var(--accent)}.dots{letter-spacing:8px}.dashboard{display:grid;grid-template-columns:260px 1fr;gap:18px;height:900px;margin-top:18px}.rail{border:1px solid #ffffff1c;background:#071019cc;padding:28px 22px;display:flex;flex-direction:column}.rail strong{font:700 26px var(--mono);color:var(--accent)}.rail nav{margin-top:70px}.rail nav span{display:block;padding:17px 0;border-bottom:1px solid #ffffff15;font:600 14px var(--mono)}.rail footer{margin-top:auto;font:500 12px/1.8 var(--mono);color:#9eb4c0}.workspace{display:grid;grid-template-rows:1fr 210px;gap:18px}.hero-panel,.panel{border:1px solid color-mix(in srgb,var(--accent) 34%,transparent);background:color-mix(in srgb,var(--bg) 84%,#ffffff);position:relative;overflow:hidden}.hero-panel{padding:58px}.hero-panel:after{content:"";position:absolute;width:520px;height:520px;border:1px solid var(--accent);border-radius:50%;right:-160px;top:-210px;box-shadow:0 0 90px color-mix(in srgb,var(--accent) 16%,transparent)}h1,h2{letter-spacing:-.05em;margin:0}h1{font-size:118px;line-height:1}h2{font-size:72px;line-height:1.08}.label{font:600 13px var(--mono);letter-spacing:.12em;color:var(--accent)}.terminal{margin-top:52px;background:#02070b;border:1px solid #ffffff17;padding:24px;font:500 18px/1.8 var(--mono);max-width:980px}.terminal i{color:var(--accent);font-style:normal}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.metric{padding:28px;border:1px solid #ffffff18;background:#0a151f}.metric strong{display:block;font:700 58px var(--mono);color:var(--accent)}.metric span{font:500 14px var(--mono);color:#9eb4c0}.content-grid{display:grid;grid-template-columns:1.3fr .7fr;gap:18px;height:900px;margin-top:18px}.main-panel{padding:48px}.main-panel p{font-size:28px;line-height:1.7;color:#bed0d8}.module-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:42px}.module{min-height:210px;border:1px solid #ffffff18;background:#07131d;padding:24px}.module b{display:block;font:700 25px var(--mono);margin:18px 0}.module p{font-size:17px;margin:0}.side-stack{display:grid;grid-template-rows:1fr 1fr;gap:18px}.side-stack .panel{padding:34px}.big-number{font:700 120px/1 var(--mono);color:var(--accent)}.pipeline{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:56px}.node{min-height:330px;border:1px solid var(--accent);padding:24px;position:relative}.node:nth-child(even){background:var(--soft)}.node strong{font:700 52px var(--mono);color:var(--accent)}.node p{position:absolute;left:24px;right:24px;bottom:28px;font:500 17px/1.55 var(--mono)}.controls{position:fixed;z-index:20;right:30px;bottom:26px;display:flex;align-items:center;gap:8px;padding:8px;background:#03070be8;border:1px solid #ffffff20}.controls button{width:44px;height:40px;border:1px solid #ffffff1d;background:#0b1620;color:var(--ink)}.controls span{min-width:90px;text-align:center;font:600 12px var(--mono)}.progress{position:fixed;left:0;bottom:0;height:3px;background:var(--accent);z-index:21}
</style></head><body><div class="viewport"><main class="stage" id="deck-stage"></main></div><nav class="controls"><button id="prev">←</button><span id="counter">01 / 20</span><button id="next">→</button><button id="full">⛶</button></nav><div class="progress" id="progress"></div><script src="runtime.js"></script><script>
const e=SignatureDeck.escape;SignatureDeck.boot({colors:['#091018','#00D2FF','#103F50','#F2FBFF'],render:(s,i)=>{const n=String(s.number).padStart(2,'0');if(i===0)return `<section class="slide"><div class="chrome"><span class="dots">● ● ●</span><span>HTML-ANYTHING://DECKS/VIBE-CODING</span><span>ONLINE</span></div><div class="dashboard"><aside class="rail"><strong>VIBE_OS</strong><nav><span>01 / OVERVIEW</span><span>02 / WORKFLOW</span><span>03 / BUILD</span><span>04 / SHIP</span></nav><footer>AGENTIC HTML SYSTEM<br>LOCAL-FIRST RUNTIME<br>86 TEACHER · 2026</footer></aside><div class="workspace"><article class="hero-panel"><span class="label">PRODUCT BUILD CONSOLE</span><h1>Vibe Coding<br><span style="color:var(--accent)">从想法到产品</span></h1><div class="terminal"><i>$</i> human.define("方向与体验")<br><i>$</i> ai.build("页面、功能与迭代")<br><i>✓</i> ready_to_ship = true</div></article><div class="metrics"><div class="metric"><strong>20</strong><span>COURSE MODULES</span></div><div class="metric"><strong>01</strong><span>REAL PRODUCT</span></div><div class="metric"><strong>∞</strong><span>ITERATIONS</span></div></div></div></div></section>`;if(i%4===0)return `<section class="slide"><div class="chrome"><span>PIPELINE / ${n}</span><span>${e(s.title)}</span><span>RUNNING</span></div><h2 style="margin-top:48px">${e(s.title)}</h2><div class="pipeline">${s.points.map((p,j)=>`<div class="node"><strong>0${j+1}</strong><p>${e(p)}</p></div>`).join('')}</div></section>`;return `<section class="slide"><div class="chrome"><span>MODULE / ${n}</span><span>${e(s.title)}</span><span>STATUS: READY</span></div><div class="content-grid"><article class="panel main-panel"><span class="label">ACTIVE WORKSPACE</span><h2 style="margin-top:24px">${e(s.title)}</h2><p>${e(s.body)}</p><div class="module-grid">${s.points.slice(0,4).map((p,j)=>`<div class="module"><span class="label">BLOCK_0${j+1}</span><b>${e(p.split(/[，：]/)[0])}</b><p>${e(p)}</p></div>`).join('')}</div></article><aside class="side-stack"><div class="panel"><span class="label">PAGE INDEX</span><div class="big-number">${n}</div><p style="font:500 16px/1.7 var(--mono)">HTML ANYTHING<br>DECK BLUEPRINT</p></div><div class="panel"><span class="label">SYSTEM NOTE</span><p style="font-size:24px;line-height:1.65">${e(s.points[0]||s.body)}</p></div></aside></div></section>`;}});
</script></body></html>
