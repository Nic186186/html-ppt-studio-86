<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frontend Slides｜Vibe Coding</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@600;700&family=Noto+Sans+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1e7;--accent:#ff5b3d;--soft:#f6df47;--ink:#151515;--mono:"IBM Plex Mono",monospace;--sans:"Noto Sans SC",sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0c0e12}.viewport{position:fixed;inset:0}.stage{position:absolute;width:1920px;height:1080px;transform-origin:0 0}.slide{position:absolute;inset:0;display:none;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans);padding:70px 82px}.slide.active{display:block}.slide:after{content:attr(data-page);position:absolute;right:78px;bottom:54px;font:800 17px var(--mono)}.top{height:52px;border-bottom:4px solid currentColor;display:flex;justify-content:space-between;font:800 16px var(--mono);letter-spacing:.09em}.kicker{font:800 17px var(--mono);letter-spacing:.12em;text-transform:uppercase}.display{font-size:108px;line-height:.96;letter-spacing:-.065em;margin:36px 0;font-weight:900}.marker{background:var(--soft);padding:0 .08em}.cover{padding:0;display:none;grid-template-columns:68% 32%}.cover.active{display:grid}.cover-main{padding:72px 86px;position:relative;background:var(--bg)}.cover-main:before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:var(--soft);right:100px;top:145px}.cover-main:after{content:"";position:absolute;width:270px;height:390px;background:var(--accent);right:-30px;bottom:-150px;transform:rotate(-14deg);border:4px solid var(--ink)}.cover h1{font-size:154px;max-width:1180px;position:relative;z-index:2}.cover-side{background:var(--ink);color:var(--bg);padding:70px 52px;display:flex;flex-direction:column;justify-content:space-between}.cover-side b{font-size:58px;line-height:1.08}.cover-side .badge{border:3px solid currentColor;border-radius:99px;padding:11px 16px;font:800 15px var(--mono)}.split{display:grid;grid-template-columns:42% 1fr;gap:78px;height:800px;align-items:center}.giant{font-size:300px;line-height:.8;font-weight:900;color:var(--accent);letter-spacing:-.1em}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:52px}.card{min-height:430px;border:4px solid currentColor;padding:30px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:10px 10px 0 var(--ink)}.card:nth-child(2){background:var(--soft)}.card:nth-child(3){background:var(--accent)}.card b{font-size:44px}.card p{font-size:24px;line-height:1.5}.steps{display:flex;align-items:stretch;margin-top:60px}.step{flex:1;border:4px solid currentColor;border-right:0;padding:27px;min-height:310px}.step:last-child{border-right:4px solid currentColor}.step strong{font-size:66px}.step span{display:block;margin-top:90px;font:800 18px var(--mono)}.statement{background:var(--ink);color:var(--bg);display:none;align-items:center}.statement.active{display:flex}.statement blockquote{font-size:106px;line-height:1.12;font-weight:900;max-width:1540px;margin:0}.statement i{color:var(--accent);font-style:normal}.controls{position:fixed;z-index:20;left:50%;bottom:20px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:9px;background:#11151bdd;border:1px solid #ffffff26;border-radius:99px}.controls button{width:46px;height:46px;border:0;border-radius:50%;background:#ffffff15;color:white;font-size:20px}.controls span{color:white;min-width:90px;text-align:center;font:800 12px var(--mono)}.progress{position:fixed;left:0;bottom:0;height:5px;background:var(--accent);z-index:21}
</style></head><body><div class="viewport"><main class="stage" id="deck-stage"></main></div><nav class="controls"><button id="prev">←</button><span id="counter">01 / 20</span><button id="next">→</button><button id="full">⛶</button></nav><div class="progress" id="progress"></div><script src="runtime.js"></script><script>
const e=SignatureDeck.escape;SignatureDeck.boot({colors:['#F6F1E7','#FF5B3D','#F6DF47','#151515'],render:(s,i)=>{const n=String(s.number).padStart(2,'0');if(i===0)return `<section class="slide cover" data-page="${n}"><div class="cover-main"><div class="top"><span>FRONTEND SLIDES · PRODUCT LAB</span><span>2026</span></div><h1 class="display">Vibe Coding<br><span class="marker">从想法到产品</span></h1><div class="kicker">女性 AI 学习圈 · 86 老师</div></div><aside class="cover-side"><span class="badge">SIGNATURE / BOLD LAB</span><b>你负责<br>想象。<br><span style="color:var(--accent)">AI 负责<br>实现。</span></b><small class="kicker">IDEA → DEMO → PRODUCT</small></aside></section>`;if(i%5===1)return `<section class="slide" data-page="${n}"><div class="top"><span>${n} / COURSE LAB</span><span>${e(s.title)}</span></div><div class="split"><div class="giant">${n}</div><div><div class="kicker">ONE PAGE · ONE SIGNAL</div><h2 class="display">${e(s.title)}</h2><p style="font-size:31px;line-height:1.6">${e(s.body)}</p></div></div></section>`;if(i%5===2)return `<section class="slide" data-page="${n}"><div class="top"><span>${n} / BUILDING BLOCKS</span><span>${e(s.title)}</span></div><h2 class="display">${e(s.title)}</h2><div class="cards">${s.points.slice(0,3).map((p,j)=>`<article class="card"><span class="kicker">0${j+1}</span><b>${e(p.split(/[，：]/)[0])}</b><p>${e(p)}</p></article>`).join('')}</div></section>`;if(i%5===3)return `<section class="slide" data-page="${n}"><div class="top"><span>${n} / ACTION FLOW</span><span>${e(s.title)}</span></div><h2 class="display">${e(s.title)}</h2><div class="steps">${s.points.map((p,j)=>`<div class="step"><strong>0${j+1}</strong><span>${e(p)}</span></div>`).join('')}</div></section>`;if(i%5===4)return `<section class="slide statement" data-page="${n}"><blockquote>${e(s.title)}<br><i>${e(s.points[0]||s.body)}</i></blockquote></section>`;return `<section class="slide" data-page="${n}"><div class="top"><span>${n} / FIELD NOTE</span><span>${e(s.title)}</span></div><div class="split"><div><div class="kicker">VIBE CODING</div><h2 class="display">${e(s.title)}</h2></div><div class="cards" style="grid-template-columns:1fr 1fr;margin:0">${s.points.slice(0,4).map((p,j)=>`<article class="card" style="min-height:250px"><span class="kicker">POINT ${j+1}</span><p>${e(p)}</p></article>`).join('')}</div></div></section>`;}});
</script></body></html>
