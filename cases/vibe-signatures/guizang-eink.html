const e=SignatureDeck.escape;SignatureDeck.boot({colors:['#F0EFE7','#D3030F','#B9B9B1','#202631'],render:(s,i)=>{const n=String(s.number).padStart(2,'0');if(i===0)return `<section class="slide cover"><div class="spine">归藏电子杂志 · 第一期</div><main class="cover-main"><div class="head"><span>VIBE CODING / 2026</span><span>01 — 20</span></div><h1>从想法<br>到<span>产品</span></h1><div><div class="seal">AI<br>实战</div><p style="font:700 20px/1.8 var(--sans)">女性 AI 学习圈 · 86 老师</p></div></main><aside class="cover-side"><small>EDITORIAL × E-INK<br>CHINESE MAGAZINE SYSTEM</small><strong>你负责想象，<br><span style="color:var(--accent)">AI 负责实现。</span></strong><small>想 → 说 → 看 → 改 → 发</small></aside></section>`;if(i%5===2)return `<section class="slide ink-slide"><div class="spine">章节 · ${n}</div><div class="head"><span>归藏 / 电子墨水</span><span>${e(s.title)}</span></div><div class="ink-grid"><div class="ink-num">${n}</div><div class="ink-copy"><h2>${e(s.title)}</h2><p>${e(s.body)}</p></div></div></section>`;if(i%5===4)return `<section class="slide poster"><div class="spine">观点 · ${n}</div><main class="poster-main"><div class="head"><span>MONOCLE / OPINION</span><span>${n}</span></div><h2>${e(s.title)}</h2><p style="font-size:30px;line-height:1.8">${e(s.body)}</p></main><aside class="poster-side"><span style="font:700 16px var(--sans)">KEY STATEMENT</span><b>${e(s.points[0]||s.title)}</b><span style="font:700 16px var(--sans)">VIBE CODING</span></aside></section>`;return `<section class="slide"><div class="spine">目录 · ${n}</div><div class="head"><span>VIBE CODING / FIELD GUIDE</span><span>${n} / 20</span></div><div class="layout"><article class="article"><h2>${e(s.title)}</h2><p>${e(s.body)}</p><div class="toc">${s.points.slice(0,4).map((p,j)=>`<div><b>0${j+1}</b><span>${e(p)}</span></div>`).join('')}</div></article><aside class="margin-note"><strong>${n}</strong><span>归藏电子杂志 · 电子墨水版</span></aside></div></section>`;}});
